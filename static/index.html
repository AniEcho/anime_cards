<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0c10">
  <title>Ani Echo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* Жестко фиксируем экран, убираем горизонтальный скролл и зум на всех вкладках */
    html, body { 
      margin: 0; 
      padding: 0; 
      background: radial-gradient(circle at top, #141824 0%, #0a0c10 100%); 
      color: #e0dce8; 
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif; 
      overscroll-behavior-y: none; 
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden; /* Запрещает сдвиг экрана вбок */
      position: relative;
    }
    
    main { 
      max-width: 650px; 
      margin: 0 auto; 
      padding: 18px 14px 120px; 
      padding-top: max(18px, env(safe-area-inset-top)); 
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    
    /* Верхняя панель */
    .top-dashboard { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; margin-bottom: 16px; background: rgba(30, 26, 38, 0.6); border: 1px solid rgba(183, 117, 255, 0.2); border-radius: 16px; backdrop-filter: blur(10px); position: relative; z-index: 10; }    
    .dash-profile-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
    .dash-timers-block { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid rgba(183,117,255,0.15); }

    /* Стили таймеров для идеальной ровности и зеленого цвета готовности */
    .timer-text { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; color: #b775ff; transition: color 0.25s ease; }
    .timer-text.ready { color: #77cd91 !important; }
    
    /* Блок управления */
    .dash-controls-row { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
    
    /* Переключатель Мои / Сеты */
    .tab-switcher { display: flex; background: #1e1a26; border-radius: 14px; padding: 4px; border: 1px solid #3a304a; width: 100%; }
    .tab-switcher button { flex: 1; padding: 8px 12px; border: none; background: transparent; color: #8a8299; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; text-align: center; }
    .tab-switcher button.active { background: #b775ff; color: #fff; box-shadow: 0 0 10px rgba(183, 117, 255, 0.4); }

    /* Панель фильтров */
    .filter-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
    .filter-dropdown-wrap { position: relative; flex: 1; min-width: 130px; }
    
    .filter-chip { background: #1e1a26; border: 1px solid #3a304a; color: #e0dce8; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 4px; transition: 0.2s; width: 100%; }
    .filter-chip.active { border-color: #b775ff; color: #fff; background: rgba(183, 117, 255, 0.15); }
    
    .btn-reset { background: #2a1012; border: 1px solid #9b4c51; color: #ffc2c7; height: 36px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; font-weight: bold; gap: 4px; flex-shrink: 0; transition: 0.2s; }
    .btn-reset:active { transform: scale(0.95); }

    .filter-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 6px; width: 220px; background: #16121c; border: 1px solid #3a304a; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 9999; padding: 8px; flex-direction: column; max-height: 50vh; overflow-y: auto; }
    .filter-menu.active { display: flex; }
    .filter-option { padding: 8px 10px; cursor: pointer; border-radius: 6px; color: #8a8299; font-size: 13px; }
    .filter-option.active { background: #3a1a4a; color: #fff; }
    
    button, select { font-family: 'Rajdhani', inherit; font-weight: 600; font-size: 16px; color: #e0dce8; background: #1e1a26; border: 1px solid #3a304a; border-radius: 12px; padding: 12px; cursor: pointer; outline: none; transition: all 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: linear-gradient(135deg, #5a2a6e 0%, #3a1a4a 100%); border-color: #8e44ad; color: #fff; box-shadow: 0 4px 15px rgba(90, 42, 110, 0.4); }
    .wide { width: 100%; margin: 8px 0; display: block; }
    
    /* Сетка карточек */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }

    #notice { padding: 12px; background: rgba(183, 117, 255, 0.1); color: #de8aff; border: 1px solid rgba(183, 117, 255, 0.3); border-radius: 12px; margin-bottom: 16px; font-size: 13px; }
    #result { margin-top: 14px; padding: 14px; border: 1px solid rgba(183, 117, 255, 0.3); border-radius: 12px; white-space: pre-line; background: #1a1225; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
    .quote { font-size: 18px; line-height: 1.5; padding: 18px; background: #1e1a26; border-left: 4px solid #b775ff; border-radius: 0 12px 12px 0; }
    .timer { color: #de8aff; margin: 12px 0; font-size: 14px; font-weight: bold; }
    footer { margin-top: 24px; color: #5a5066; font-size: 12px; text-align: center; }

    /* Стили карточек */
    .card, .set-card { background: #16121c; border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .portrait, .set-card-img { aspect-ratio: 1 / 1.2; display: flex; align-items: flex-start; justify-content: center; position: relative; overflow: hidden; background: #0a0c10; }
    .card-bg, .set-card-bg { position: absolute; top: -10%; left: -10%; right: -10%; bottom: -10%; background-size: cover; background-position: center; filter: blur(15px) brightness(0.4); z-index: 0; }
    .portrait img, .set-card-img img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    
    .info, .set-card-info { padding: 12px 10px; background: #16121c; display: flex; flex-direction: column; gap: 4px; z-index: 2; border-top: 1px solid rgba(183, 117, 255, 0.1); min-height: 95px; justify-content: flex-start; }
    
    .name { font-weight: 700; font-size: 14px; color: #fff; margin: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .set-card-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag, .set-card-rarity { font-size: 9px; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor; border-radius: 4px; align-self: flex-start; font-weight: bold; }
    .points, .set-card-points { color: #fbbf24; margin-top: 2px; font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 3px; }
    .missing { opacity: 0.4; }
    .missing .portrait img, .missing .set-card-img img { filter: grayscale(100%); opacity: 0.2; }
    
    .rarity-Обычная { border: 1px solid #5a5066; }
    .rarity-Необычная { border: 1px solid #4a7c59; box-shadow: 0 0 8px rgba(74, 124, 89, 0.3); }
    .rarity-Редкая { border: 1px solid #4a6c9c; box-shadow: 0 0 10px rgba(74, 108, 156, 0.4); }
    .rarity-Эпическая { border: 1px solid #8346c4; box-shadow: 0 0 12px rgba(131, 70, 196, 0.5); }
    .rarity-Легендарная { border: 1px solid #d49a43; box-shadow: 0 0 15px rgba(212, 154, 67, 0.6); }
    .rarity-Мифическая { border: 1px solid #b775ff; box-shadow: 0 0 20px rgba(183, 117, 255, 0.8), inset 0 0 10px rgba(183, 117, 255, 0.2); }
    .holo-effect { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(183,117,255,0.15) 30%, rgba(255,255,255,0) 60%); background-size: 200% 200%; animation: holoMove 4s infinite linear; mix-blend-mode: overlay; }
    @keyframes holoMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }
    
    .sets-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .set-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #1e1a26; border-radius: 12px; cursor: pointer; border: 1px solid #3a304a; transition: all 0.2s; }
    .set-row-title { font-weight: 600; font-size: 15px; color: #fff; }
    .set-row-progress { font-weight: 900; font-size: 14px; }
    .set-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }

    /* Плавающая кнопка (FAB) */
    .fab-main { position: fixed; bottom: 20px; right: 20px; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #b775ff, #5a2a6e); border: 2px solid #de8aff; box-shadow: 0 0 20px rgba(183, 117, 255, 0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; transition: transform 0.3s; }
    .fab-main.active { transform: rotate(45deg); }
    .fab-avatar { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff; }
    .fab-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 12, 16, 0.8); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 90; }
    .fab-overlay.active { opacity: 1; pointer-events: auto; }
    .fab-menu { position: fixed; bottom: 20px; right: 20px; width: 64px; height: 64px; z-index: 99; pointer-events: none; }
    .fab-btn { position: absolute; bottom: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: #1e1a26; border: 1px solid #b775ff; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; opacity: 0; transform: translate(0, 0) scale(0.5); transition: all 0.3s; pointer-events: none; }
    .fab-btn svg { width: 20px; height: 20px; fill: #de8aff; }
    .fab-menu.active .fab-btn { opacity: 1; transform: translate(0, 0) scale(1); pointer-events: auto; }
    
    .fab-menu.active .fab-btn[data-tab="collection"] { transform: translate(-20px, -250px); }
    .fab-menu.active .fab-btn[data-tab="games"] { transform: translate(-90px, -230px); }
    .fab-menu.active .fab-btn[data-tab="trades"] { transform: translate(-160px, -180px); }
    .fab-menu.active .fab-btn[data-tab="leaderboard"] { transform: translate(-210px, -110px); }
    .fab-menu.active .fab-btn[data-tab="shop"] { transform: translate(-230px, -30px); }
    
    .fab-profile { position: fixed; bottom: 110px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; z-index: 100; opacity: 0; pointer-events: none; transform: translateY(20px); transition: all 0.3s; max-width: 200px; background: rgba(22, 18, 28, 0.95); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(183, 117, 255, 0.5); box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
    .fab-profile.active { opacity: 1; transform: translateY(0); }
    .fab-profile-name { font-size: 18px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fab-profile-stats { display: flex; gap: 8px; margin-top: 4px; width: 100%; justify-content: flex-end; }
    .fab-rating { font-size: 14px; font-weight: 900; color: #fbbf24; }
    .fab-cards { font-size: 11px; font-weight: 700; color: #b775ff; background: rgba(183, 117, 255, 0.2); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(183,117,255,0.4);}

    /* Модальное окно награды */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 12, 16, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 12px; }
    .modal-overlay.active { display: flex; }
    .reward-content { background: #1a1225; border: 1px solid rgba(183, 117, 255, 0.3); border-radius: 20px; width: 100%; max-width: 480px; padding: 24px 20px; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .reward-close { position: absolute; top: 14px; right: 14px; background: transparent; border: none; color: #8a8299; font-size: 22px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .reward-close:active { background: rgba(255,255,255,0.1); }
    .reward-title { font-size: 22px; font-weight: 900; color: #fbbf24; margin: 0 0 16px 0; text-shadow: 0 0 15px rgba(251,191,36,0.4); text-align: center; }
    .reward-body { display: flex; flex-direction: row; align-items: center; width: 100%; gap: 16px; }
    .reward-left { width: 140px; flex-shrink: 0; }
    .reward-left .card { margin: 0; }
    .reward-left .portrait { aspect-ratio: 1 / 1.2; }
    .reward-left .info { padding: 8px 6px; min-height: auto; gap: 2px; }
    .reward-left .name { font-size: 12px; }
    .reward-left .tag { font-size: 8px; padding: 1px 4px; }
    .reward-left .points { font-size: 11px; }
    .reward-left .muted { font-size: 9px !important; }
    .reward-right { width: 100%; display: flex; flex-direction: column; align-items: stretch; text-align: left; }
    .reward-points { font-size: 15px; color: #fff; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; width: 100%; font-weight: 700; }
    .reward-info-block { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-bottom: 14px; }
    .reward-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #8a8299; margin-bottom: 1px; }
    .reward-value { font-size: 14px; font-weight: 700; color: #fff; }

    /* ===== КОНТЕЙНЕР ПАЗЛА ===== */

    .puzzle-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      box-sizing: border-box;
      margin-top: 10px;
      margin-bottom: 60px;
    }

    /* ===== ПОЛЕ СБОРКИ ===== */

    .puzzle-area {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1 / 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(183, 117, 255, 0.5);
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
      z-index: 1;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
    }

    /* ===== СЕТКА ЯЧЕЕК ===== */

    .puzzle-grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    .puzzle-cell {
      box-sizing: border-box;
      border: 1px solid rgba(183, 117, 255, 0.15);
      background: rgba(183, 117, 255, 0.02);
      transition: all 0.2s ease;
    }

    .puzzle-cell.highlight {
      background: rgba(183, 117, 255, 0.2);
      border-color: rgba(183, 117, 255, 0.8);
      box-shadow: inset 0 0 15px rgba(183, 117, 255, 0.5);
    }

    /* ===== ЛЕНТА С КУСОЧКАМИ ===== */

    .puzzle-tray {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      max-width: 350px;
      margin-top: 16px;
      padding: 14px;
      background: rgba(20, 16, 26, 0.95);
      border: 1px solid rgba(183, 117, 255, 0.35);
      border-radius: 16px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .puzzle-tray::-webkit-scrollbar { height: 4px; }
    .puzzle-tray::-webkit-scrollbar-thumb { background: rgba(183, 117, 255, 0.4); border-radius: 2px; }

    /* ===== КУСОЧЕК В ЛЕНТЕ ===== */

    .puzzle-piece {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      cursor: grab;
      position: relative;
      touch-action: none;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(183, 117, 255, 0.5);
      background-size: cover;
      background-position: center;
      transition: transform 0.1s;
    }

    /* ===== КУСОЧЕК В ПОЛЁТЕ ===== */

    .puzzle-piece.dragging {
      position: fixed !important;
      z-index: 9999;
      pointer-events: none;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.9));
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0;
      transform: none;
    }

    /* ===== КУСОЧЕК НА ПОЛЕ ===== */

    .puzzle-piece.placed {
      position: absolute !important;
      border-radius: 0;
      box-shadow: none;
      cursor: default;
      transform: none;
    }

    /* ===== ПРАВИЛЬНО ЗАКРЕПЛЁННЫЙ КУСОЧЕК ===== */

    .puzzle-piece.locked {
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
     <header class="top-dashboard">
      
      <!-- ПРОФИЛЬ -->
      <div class="dash-profile-row">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div id="header-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #b775ff, #5a2a6e); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0; overflow: hidden;"></div>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <div id="header-name" style="font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Загрузка...</div>
            <div style="font-size: 12px; font-weight: 700; color: #fff; display: flex; gap: 4px; align-items: center; white-space: nowrap;">
              <span id="header-rating">#0 — 0</span>
            </div>
          </div>
        </div>

        <div style="text-align: right; display: flex; flex-direction: column; gap: 1px; flex-shrink: 0;">
          <div style="font-size: 13px; font-weight: 700; color: #e0dce8; text-transform: uppercase; letter-spacing: 0.5px;">Коллекция</div>
          <div id="stat-cards" style="font-size: 11px; font-weight: 500; color: #8a8299;">Собранных карт: 0 / 0</div>
          <div id="stat-animes" style="font-size: 11px; font-weight: 500; color: #8a8299;">Собранных аниме: 0 / 0</div>
        </div>
      </div>

      <!-- ТАЙМЕРЫ -->
      <div id="timers-header" class="dash-timers-block">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; background: rgba(183,117,255,0.05); border-radius: 8px; border: 1px solid rgba(183,117,255,0.1);">
          <span style="font-size: 11px; font-weight: 700; color: #8a8299; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;">Бесплатная карта</span>
          <span id="cd-free" class="timer-text">Загрузка...</span>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
            <span style="font-size: 11px; font-weight: 600; color: #8a8299; text-transform: uppercase; margin-bottom: 2px;">Пазл</span>
            <span id="cd-puzzle" class="timer-text">Загрузка...</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
            <span style="font-size: 11px; font-weight: 600; color: #8a8299; text-transform: uppercase; margin-bottom: 2px;">Цитаты</span>
            <span id="cd-quotes" class="timer-text">Загрузка...</span>
          </div>
        </div>
      </div>

      <!-- УПРАВЛЕНИЕ: ПЕРЕКЛЮЧАТЕЛЬ СВЕРХУ, ФИЛЬТРЫ ПОД НИМ -->
      <div id="collection-controls" class="dash-controls-row" style="display: none;">
        
        <!-- Большой и удобный переключатель вкладок -->
        <div class="tab-switcher" id="tab-switcher">
          <button id="tab-mine" onclick="switchTab('mine')">Мои карты</button>
          <button id="tab-sets" onclick="switchTab('sets')">Сеты аниме</button>
        </div>

        <!-- Панель фильтров -->
        <div class="filter-bar" id="filter-bar">
          <div class="filter-dropdown-wrap">
            <button class="filter-chip" onclick="toggleFilterDropdown('rarity')"><span id="label-rarity">Все редкости</span> ▾</button>
            <div class="filter-menu" id="menu-rarity"></div>
          </div>
          <div class="filter-dropdown-wrap">
            <button class="filter-chip" onclick="toggleFilterDropdown('anime')"><span id="label-anime">Все аниме</span> ▾</button>
            <div class="filter-menu" id="menu-anime"></div>
          </div>
          <button id="btn-dupes" class="filter-chip" onclick="toggleDupesFilter()" style="flex: auto; width: auto; justify-content: center;">Только повторки</button>
          <button id="btn-reset-filters" class="btn-reset" onclick="resetFilters()" style="display: none;">✕ Сбросить</button>
        </div>

      </div>
    </header>
    <div id="notice" hidden></div>
    <section id="view"></section>
    <div id="result" hidden></div>
    <footer>Карты и цитаты в комплекте — тестовые. Анимаций нет.</footer>
  </main>
  
  <div class="fab-overlay" id="fab-overlay" onclick="toggleFab(false)"></div>
  <div class="fab-menu" id="fab-menu">
    <button class="fab-btn" data-tab="collection" data-label="Коллекция" onclick="show('collection'); toggleFab(false)"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 11H9v-2h8v2zm0-4H9V7h8v2z"/></svg></button>
    <button class="fab-btn" data-tab="games" data-label="Игры" onclick="show('games'); toggleFab(false)"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></button>
    <button class="fab-btn" data-tab="trades" data-label="Обмены" onclick="show('trades'); toggleFab(false)"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></button>
    <button class="fab-btn" data-tab="leaderboard" data-label="Рейтинг" onclick="show('leaderboard'); toggleFab(false)"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
    <button class="fab-btn" data-tab="shop" data-label="Магазин" onclick="show('shop'); toggleFab(false)"><svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg></button>
  </div>
  <div class="fab-main" id="fab-main" onclick="toggleFab()"><div class="fab-avatar" id="fab-avatar" style="overflow: hidden;">?</div></div>
  <div class="fab-profile" id="fab-profile">
    <div class="fab-profile-name" id="fab-name">Загрузка…</div>
    <div class="fab-profile-stats"><span class="fab-rating" id="fab-rating">#0 — 0</span><span class="fab-cards" id="fab-cards">0/0</span></div>
  </div>

  <div id="reward-modal" class="modal-overlay" onclick="closeReward(event)">
    <div class="reward-content" onclick="event.stopPropagation()">
      <button class="reward-close" onclick="closeReward()">✕</button>
      <h2 class="reward-title">Карта получена!</h2>
      <div class="reward-body">
        <div class="reward-left"><div id="reward-card-container"></div></div>
        <div class="reward-right">
          <div class="reward-points" id="reward-subtitle"></div>
          <div class="reward-info-block">
            <div><div class="reward-label">Персонаж</div><div class="reward-value" id="reward-name"></div></div>
            <div><div class="reward-label">Аниме</div><div class="reward-value" id="reward-anime" style="color: #b775ff;"></div></div>
            <div style="display: flex; gap: 20px; margin-top: 4px;">
              <div style="flex: 1;"><div class="reward-label">Редкость</div><div class="reward-value" id="reward-rarity"></div></div>
              <div style="flex: 1;"><div class="reward-label">В коллекции</div><div class="reward-value" id="reward-count"></div></div>
            </div>
          </div>
          <button onclick="closeReward()" class="primary wide" style="margin-top: 10px; padding: 12px; font-size: 15px; border-radius: 12px;">Забрать</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0c10'); tg.setBackgroundColor('#0a0c10'); }
    const auth = tg?.initData ? 'tma ' + tg.initData : 'dev';

    let profile, tab = 'collection', session = null, ticker = null, busy = false;
    let currentAnime = null;
    let collectionTab = 'mine';
    let gameTicker = null;
    let filterAnime = '';
    let filterRarity = '';
    let filterDupes = false; 
    let puzzleState = null;
    let puzzleSession = null;
    let puzzleTicker = null;
    
    const $ = id => document.getElementById(id);
    const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const colors = { 'Обычная': '#b7b7bd', 'Необычная': '#77cd91', 'Редкая': '#78aafa', 'Эпическая': '#b775ff', 'Легендарная': '#f2b458', 'Мифическая': '#de8aff' };

    async function api(path, data) {
      const r = await fetch('/api/' + path, {
        method: data === undefined ? 'GET' : 'POST',
        headers: { 'Authorization': auth, 'Content-Type': 'application/json' },
        body: data === undefined ? undefined : JSON.stringify(data)
      });
      let j;
      try { j = await r.json(); } catch { throw Error('Сервер вернул некорректный ответ'); }
      if (!r.ok) throw Error(typeof j.detail === 'string' ? j.detail : 'Ошибка запроса');
      return j;
    }

    function updateCooldowns() {
      if (!profile) return;
      
      const now = Date.now()/1000 + (profile.server_time - profile.client_time);
      
      const renderTimer = (elId, targetTime, readyText) => {
        const el = $(elId);
        if (!el) return;
        
        const left = Math.max(0, Math.ceil(targetTime - now));
        
        if (left === 0) {
          el.textContent = readyText;
          el.classList.add('ready');
        } else {
          const h = Math.floor(left / 3600);
          const m = Math.floor((left % 3600) / 60);
          const s = left % 60;
          const str = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          el.textContent = str;
          el.classList.remove('ready');
        }
      };

      renderTimer('cd-free', profile.free_at, 'Можно получить карту');
      renderTimer('cd-puzzle', profile.puzzle_at || 0, 'Можно играть');
      renderTimer('cd-quotes', profile.quotes_at || 0, 'Можно играть');
    }

    async function refresh() {
      profile = await api('me');
      
      // --- ЛОГИКА АВАТАРКИ ---
      const initial = profile.name.charAt(0).toUpperCase();
      const photoUrl = profile.photo_url;
      
      // Функция для создания HTML аватарки
      const getAvatarHtml = (size, fontSize) => {
        if (photoUrl) {
          return `<img src="${esc(photoUrl)}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" alt="Avatar">`;
        }
        return `<div style="width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: ${fontSize}px; font-weight: 700; color: #fff;">${initial}</div>`;
      };

      // Обновляем шапку профиля
      if ($('header-avatar')) {
        $('header-avatar').innerHTML = getAvatarHtml(40, 18);
      }
      if ($('header-name')) $('header-name').textContent = profile.name;
      
      if ($('header-rating')) {
        let phrase = '';
        if (profile.rank === 1 && Math.random() < 0.2) phrase = ' — воу ну ты и низко(';
        else if (profile.rank <= 3 && Math.random() < 0.1) phrase = ' — неплохо)';
        
        let rankColor = '#b775ff'; 
        let rankGlow = '';
        if (profile.rank === 1) { rankColor = '#fbbf24'; rankGlow = 'text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);'; }
        else if (profile.rank === 2) { rankColor = '#cbd5e1'; rankGlow = 'text-shadow: 0 0 10px rgba(203, 213, 225, 0.6);'; }
        else if (profile.rank === 3) { rankColor = '#d49a43'; rankGlow = 'text-shadow: 0 0 10px rgba(212, 154, 67, 0.6);'; }

        let phraseHtml = phrase ? `<span style="color: #8a8299; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 120px; vertical-align: middle; margin-left: 4px;">${phrase}</span>` : '';
        $('header-rating').innerHTML = `<span style="color: ${rankColor}; ${rankGlow}">#${profile.rank}</span> <span style="color: #8a8299;">—</span> <span style="color: #fff;">${profile.rating.toLocaleString('ru-RU')}</span>${phraseHtml}`;
      }
      
      if ($('stat-cards')) $('stat-cards').textContent = `Собранных карт: ${profile.unique} / ${profile.cards.length}`;
      if ($('stat-animes')) {
        const animeStats = {};
        profile.cards.forEach(c => {
          if (!animeStats[c.anime]) animeStats[c.anime] = { total: 0, collected: 0 };
          animeStats[c.anime].total += 1;
          if (c.count > 0) animeStats[c.anime].collected += 1;
        });
        const totalAnimes = Object.keys(animeStats).length;
        const completedAnimes = Object.values(animeStats).filter(a => a.collected === a.total).length;
        $('stat-animes').textContent = `Собранных аниме: ${completedAnimes} / ${totalAnimes}`;
      }
      
      // Обновляем FAB
      if ($('fab-avatar')) {
        $('fab-avatar').innerHTML = getAvatarHtml(64, 28);
      }
      if ($('fab-name')) $('fab-name').textContent = profile.name;
       if ($('fab-rating')) {
        let rankColor = '#b775ff';
        let rankGlow = '';
        if (profile.rank === 1) { rankColor = '#fbbf24'; rankGlow = 'text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);'; }
        else if (profile.rank === 2) { rankColor = '#cbd5e1'; rankGlow = 'text-shadow: 0 0 10px rgba(203, 213, 225, 0.6);'; }
        else if (profile.rank === 3) { rankColor = '#d49a43'; rankGlow = 'text-shadow: 0 0 10px rgba(212, 154, 67, 0.6);'; }

        $('fab-rating').innerHTML = `<span style="color: ${rankColor}; ${rankGlow}">#${profile.rank}</span> <span style="color: #8a8299;">—</span> <span style="color: #fff;">${profile.rating.toLocaleString('ru-RU')}</span>`;
      }
      if ($('fab-cards')) $('fab-cards').textContent = `${profile.unique} / ${profile.cards.length}`;
      
      updateCooldowns();
    }

    function card(c) {
      const isMissing = c.count === 0;
      const rarityColor = colors[c.rarity] || '#aaa';
      const bgHtml = (c.image && !isMissing) ? `<div class="card-bg" style="background-image: url('${esc(c.image)}')"></div>` : '';
      let contentHtml = '';
      if (c.image && !isMissing) {
        contentHtml = `<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}">`;
      } else {
        contentHtml = `${bgHtml}<div class="no-image-text">${esc(c.name)}</div>`;
      }
      const holoHtml = (!isMissing && (c.rarity === 'Легендарная' || c.rarity === 'Мифическая')) ? `<div class="holo-effect"></div>` : '';
      const rarityClass = `rarity-${c.rarity.replace(/\s+/g, '')}`;
      
      return `
        <article class="card ${rarityClass} ${isMissing ? 'missing' : ''}">
          <div class="portrait">${bgHtml}${contentHtml}${holoHtml}</div>
          <div class="info">
            <div class="name">${esc(c.name)}</div>
            <span class="tag" style="color:${rarityColor}">${esc(c.rarity)}</span>
            <div class="points" style="color: #b775ff;">${c.points}</div>
            <div class="muted" style="font-size:10px; margin-top:2px; font-weight:600; color:${isMissing ? '#555' : '#8a8299'};">В коллекции: ${c.count}</div>
          </div>
        </article>
      `;
    }

    async function show(next) {
      if (busy) return;
      if (tab === 'games' && puzzleSession) {
        // Ожидаем отмену на сервере и свежие данные, чтобы кулдаун обновился сразу
        await api('game/puzzle/cancel', { session_id: puzzleSession.session_id }).catch(() => {});
        puzzleSession = null;
        puzzleState = null;
        await sync();
      }
      tab = next;
      clearInterval(ticker);
      clearInterval(puzzleTicker);
      session = null;
      puzzleState = null;
      $('result').hidden = true;
      document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('active'));
      
      const collectionControls = $('collection-controls');
      const timersHeader = $('timers-header');
      
      if (tab === 'collection') {
        if (collectionControls) collectionControls.style.display = 'flex';
        if (timersHeader) timersHeader.style.display = 'flex';
        switchTab('mine'); 
      } else {
        if (collectionControls) collectionControls.style.display = 'none';
        if (timersHeader) timersHeader.style.display = 'none';
        if (tab === 'games') games();
        else if (tab === 'trades') showStub('Обмены', 'Здесь можно будет обмениваться картами с другими игроками.');
        else if (tab === 'leaderboard') leaderboardView();
        else if (tab === 'shop') showStub('Магазин', 'Здесь появятся паки с картами и другие товары.');
      }
    }

    function showStub(title, description) {
      $('view').innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 60px 20px; background: rgba(183,117,255,0.05); border-radius: 20px; border: 1px dashed rgba(183,117,255,0.3);"><div style="font-size: 48px; margin-bottom: 16px;">🚧</div><h2 style="margin:0 0 10px 0; color:#fff;">${title}</h2><p class="muted" style="margin:0; font-size: 14px; max-width: 300px;">${description}</p></div>`;
    }

    async function leaderboardView() {
      $('view').innerHTML = '<p class="muted" style="text-align:center; margin-top: 40px;">Загрузка рейтинга...</p>';
      try {
        const data = await api('leaderboard');
        const list = data.leaderboard;
        if (list.length === 0) {
          $('view').innerHTML = `<h2>Рейтинг</h2><p class="muted" style="text-align:center; margin-top: 20px;">Пока никто не собрал карт.</p>`;
          return;
        }
        const html = list.map(item => {
          let rankStyle = 'color: #8a8299; font-size: 18px; font-weight: 900;'; 
          if (item.rank === 1) rankStyle = 'color: #fbbf24; font-size: 24px; font-weight: 900; text-shadow: 0 0 15px rgba(251, 191, 36, 1), 0 0 30px rgba(251, 191, 36, 0.6);';
          else if (item.rank === 2) rankStyle = 'color: #cbd5e1; font-size: 22px; font-weight: 900; text-shadow: 0 0 12px rgba(203, 213, 225, 1), 0 0 20px rgba(203, 213, 225, 0.5);';
          else if (item.rank === 3) rankStyle = 'color: #d49a43; font-size: 20px; font-weight: 900; text-shadow: 0 0 8px rgba(212, 154, 67, 0.8);';
          
          return `<div class="set-row" style="padding: 12px 16px; ${item.is_me ? 'border-color: #b775ff; background: rgba(183, 117, 255, 0.1);' : ''}"><div style="display: flex; align-items: center; gap: 16px;"><div style="${rankStyle} width: 30px; text-align: center; font-family: 'Rajdhani', sans-serif;">${item.rank}</div><div style="font-weight: 700; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;">${esc(item.name)} ${item.is_me ? '<span style="font-size:10px; color:#b775ff;">(Вы)</span>' : ''}</div></div><div style="font-weight: 900; color: #fff; font-size: 16px;">${item.rating.toLocaleString('ru-RU')}</div></div>`;
        }).join('');
        $('view').innerHTML = `<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 15px;"><div><h2 style="margin:0;">Рейтинг</h2><p class="muted" style="margin:4px 0 0 0;">Топ-50 игроков по рейтингу</p></div></div><div class="sets-list">${html}</div>`;
      } catch (e) { error(e); }
    }
    
    function switchTab(nextTab) {
      collectionTab = nextTab;
      currentAnime = null; 
      
      if ($('tab-mine')) $('tab-mine').classList.toggle('active', nextTab === 'mine');
      if ($('tab-sets')) $('tab-sets').classList.toggle('active', nextTab === 'sets');
      
      const filterBar = $('filter-bar');
      if (filterBar) {
        filterBar.style.display = nextTab === 'sets' ? 'none' : 'flex';
      }
      
      collection(); 
    }

    function collection() {
      const view = $('view');
      if (!currentAnime) {
        if ($('label-rarity')) $('label-rarity').textContent = filterRarity || 'Все редкости';
        if ($('label-anime')) $('label-anime').textContent = filterAnime || 'Все аниме';
        if ($('btn-dupes')) $('btn-dupes').classList.toggle('active', filterDupes);
        const hasFilters = Boolean(filterAnime || filterRarity || filterDupes);
        if ($('btn-reset-filters')) $('btn-reset-filters').style.display = hasFilters ? 'flex' : 'none';
        if ($('filter-bar')) $('filter-bar').style.display = collectionTab === 'sets' ? 'none' : 'flex';
      }

      if (collectionTab === 'mine') {
        let myCards = profile.cards.filter(c => c.count > 0);
        const rarityWeight = { 'Мифическая': 6, 'Легендарная': 5, 'Эпическая': 4, 'Редкая': 3, 'Необычная': 2, 'Обычная': 1 };
        myCards.sort((a, b) => {
          const wA = rarityWeight[a.rarity] || 0;
          const wB = rarityWeight[b.rarity] || 0;
          if (wA !== wB) return wB - wA;
          return a.name.localeCompare(b.name);
        });
        if (filterAnime) myCards = myCards.filter(c => c.anime === filterAnime);
        if (filterRarity) myCards = myCards.filter(c => c.rarity === filterRarity);
        if (filterDupes) myCards = myCards.filter(c => c.count > 1);
        renderFilterMenus();
        let html = ``;
        if (myCards.length === 0) html += `<p class="muted" style="text-align:center; margin-top:20px;">По выбранным фильтрам ничего не найдено.</p>`;
        else html += `<div class="grid">${myCards.map(card).join('')}</div>`;
        view.innerHTML = html;
        return;
      }

      if (currentAnime) {
        const list = profile.cards.filter(c => c.anime === currentAnime);
        const rarityWeight = { 'Мифическая': 6, 'Легендарная': 5, 'Эпическая': 4, 'Редкая': 3, 'Необычная': 2, 'Обычная': 1 };
        list.sort((a, b) => {
          const wA = rarityWeight[a.rarity] || 0;
          const wB = rarityWeight[b.rarity] || 0;
          if (wA !== wB) return wB - wA;
          return a.name.localeCompare(b.name);
        });
        const uniqueCollected = list.filter(c => c.count > 0).length;
        
        const cardsHtml = list.map(c => {
          const isMissing = c.count === 0;
          
          const bgHtml = c.image ? `<div class="set-card-bg" style="background-image: url('${esc(c.image)}')"></div>` : '';
          let contentHtml = '';
          
          if (c.image) {
            contentHtml = `<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}">`;
          } else {
            contentHtml = `<div class="no-image-text">${esc(c.name)}</div>`;
          }
          
          const holoHtml = (!isMissing && (c.rarity === 'Легендарная' || c.rarity === 'Мифическая')) ? `<div class="holo-effect"></div>` : '';
          const rarityClass = `rarity-${c.rarity.replace(/\s+/g, '')}`;
          
          return `<div class="set-card ${rarityClass} ${isMissing ? 'missing' : ''}"><div class="set-card-img">${bgHtml}${contentHtml}${holoHtml}</div><div class="set-card-info"><div class="set-card-name" style="color:${isMissing ? '#666' : '#eee'}">${esc(c.name)}</div><div class="set-card-points" style="opacity: ${isMissing ? 0.3 : 1}; color: #b775ff;">${c.points}</div><div class="muted" style="font-size:10px; margin-top:2px; font-weight:600; color:${isMissing ? '#555' : '#8a8299'};">В коллекции: ${c.count}</div></div></div>`;
        }).join('');
        view.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;"><button id="back-to-sets" style="padding:8px 12px; font-size:14px;">← Назад</button><div style="font-weight:bold; color:#aaa;">${esc(currentAnime)} · ${uniqueCollected}/${list.length}</div></div><div class="set-grid">${cardsHtml}</div>`;
        $('back-to-sets').onclick = () => { currentAnime = null; collection(); };
        return;
      }

      const sets = {};
      profile.cards.forEach(c => {
        if (!sets[c.anime]) sets[c.anime] = { total: 0, collected: 0 };
        sets[c.anime].total += 1;
        if (c.count > 0) sets[c.anime].collected += 1;
      });
      const sortedAnimes = Object.keys(sets).sort((a, b) => a.localeCompare(b));
      const setsHtml = sortedAnimes.map(anime => {
        const data = sets[anime];
        const isCompleted = data.collected === data.total;
        const percent = Math.round((data.collected / data.total) * 100);
        return `<div class="set-row" data-anime="${esc(anime)}" style="display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 16px;"><div style="display: flex; justify-content: space-between; align-items: center;"><div class="set-row-title">${esc(anime)}</div><div class="set-row-progress" style="color:${isCompleted ? '#77cd91' : '#fff'}; font-size: 14px;">${data.collected}/${data.total} <span style="color:#8a8299; font-size:12px;">›</span></div></div><div style="width: 100%; height: 6px; background: #2a2533; border-radius: 3px; overflow: hidden;"><div style="width: ${percent}%; height: 100%; background: ${isCompleted ? '#77cd91' : '#b775ff'}; border-radius: 3px;"></div></div></div>`;
      }).join('');
      view.innerHTML = `<div class="sets-list">${setsHtml}</div>`;
      document.querySelectorAll('.set-row').forEach(el => { el.onclick = () => { currentAnime = el.dataset.anime; collection(); }; });
    }

    function toggleFilterDropdown(type) {
      const menu = $(type === 'rarity' ? 'menu-rarity' : 'menu-anime');
      const other = $(type === 'rarity' ? 'menu-anime' : 'menu-rarity');
      if (other) other.classList.remove('active');
      if (menu) menu.classList.toggle('active');
    }

    function renderFilterMenus() {
      const rarityMenu = $('menu-rarity');
      if (rarityMenu) {
        const allCards = profile.cards;
        const rarityOrder = ['Мифическая', 'Легендарная', 'Эпическая', 'Редкая', 'Необычная', 'Обычная'];
        const availableRarities = rarityOrder.filter(r => allCards.some(c => c.rarity === r));
        let html = `<div class="filter-option ${!filterRarity ? 'active' : ''}" onclick="setFilter('rarity', '')">Все редкости</div>`;
        availableRarities.forEach(r => { html += `<div class="filter-option ${filterRarity === r ? 'active' : ''}" onclick="setFilter('rarity', '${esc(r)}')">${esc(r)}</div>`; });
        rarityMenu.innerHTML = html;
      }
      const animeMenu = $('menu-anime');
      if (animeMenu) {
        const collectedCards = profile.cards.filter(c => c.count > 0);
        const availableAnimes = [...new Set(collectedCards.map(c => c.anime))].sort((a, b) => a.localeCompare(b, 'ru'));
        let html = `<div class="filter-option ${!filterAnime ? 'active' : ''}" onclick="setFilter('anime', '')">Все аниме</div>`;
        availableAnimes.forEach(a => { html += `<div class="filter-option ${filterAnime === a ? 'active' : ''}" onclick="setFilter('anime', '${esc(a)}')">${esc(a)}</div>`; });
        animeMenu.innerHTML = html;
      }
    }

    function setFilter(type, value) {
      if (type === 'rarity') filterRarity = value;
      if (type === 'anime') filterAnime = value;
      document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('active'));
      if ($('label-rarity')) $('label-rarity').textContent = filterRarity || 'Все редкости';
      if ($('label-anime')) $('label-anime').textContent = filterAnime || 'Все аниме';
      collection();
    }

      if ($('btn-dupes')) $('btn-dupes').classList.toggle('active', filterDupes);
      collection();
    }

    function resetFilters() { filterAnime = ''; filterRarity = ''; filterDupes = false; collection(); }

      if (!e.target.closest('.filter-dropdown-wrap')) document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('active'));

            puzzleWait.innerHTML = `Следующая игра через: <span style="color:#b775ff; font-size: 16px; font-weight: 800;">${str}</span>`;

          quotesBtn.style.filter = isQuotesReady ? 'none' : 'grayscale(80%) brightness(0.8)';
          quotesBtn.style.opacity = isQuotesReady ? '1' : '0.7';

        }

          if (isQuotesReady) {
            quotesWait.innerHTML = `Можно играть`;
            quotesWait.style.color = '#fbbf24';
            quotesWait.style.fontSize = '16px';
            quotesWait.style.fontWeight = 'bold';
          } else {
            const h = Math.floor(quotesLeft / 3600);
            const m = Math.floor((quotesLeft % 3600) / 60);
            const s = quotesLeft % 60;
            const str = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            quotesWait.innerHTML = `Следующая игра через: <span style="color:#b775ff; font-size: 16px; font-weight: 800;">${str}</span>`;
            quotesWait.style.color = '#8a8299';
          }
        }
      };

      updateGameTimers(); 
      gameTicker = setInterval(updateGameTimers, 1000); 
    }

    async function startQuotesGame() {
      await run(async () => {
        session = await api('game/quotes/start', {});
        await sync();
        renderSession();
      });
    }

    function renderSession() {
      clearInterval(ticker);
      $('result').hidden = true;
      $('view').innerHTML = `<h2>Цитаты: раунд ${session.round} / 3</h2><div class="quote">${esc(session.text)}</div><div id="timer" class="timer"></div><div class="choices">${session.options.map((o, i) => `<button data-choice="${i}">${esc(o)}</button>`).join('')}</div>`;
      const offset = session.server_time - Date.now()/1000;
      const tick = () => {
        const left = Math.max(0, Math.ceil(session.deadline - (Date.now()/1000 + offset)));
        if ($('timer')) $('timer').textContent = 'Осталось: ' + left + ' сек.';
        if (left === 0) {
          clearInterval(ticker);
          document.querySelectorAll('[data-choice]').forEach(b => b.disabled = true);
          $('result').hidden = false; $('result').textContent = 'Время вышло. Начни новую попытку.';
          const b = document.createElement('button'); b.className = 'wide'; b.textContent = 'К играм'; b.onclick = () => show('games'); $('result').appendChild(b);
        }
      };
      tick(); ticker = setInterval(tick, 200);
      document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => submit(Number(b.dataset.choice)));
    }

    async function submit(choice) {
      await run(async () => {
        const r = await api('game/answer', { session_id: session.id, choice, round: session.round || 1 });
        if (r.status === 'next') { session = r.session; renderSession(); return; }
        clearInterval(ticker);
        document.querySelectorAll('[data-choice]').forEach(b => { b.disabled = true; });
        await sync();
        if (r.status === 'won') prize(r.card);
        else { $('result').hidden = false; $('result').textContent = r.reason + (r.correct ? '\nПравильный ответ: ' + r.correct : ''); }
        const b = document.createElement('button'); b.textContent = 'К играм'; b.className = 'wide'; b.onclick = () => show('games'); $('result').appendChild(b);
      });
    }

    async function startPuzzleGame() {
      const btn = $('puzzle-btn');
      if (btn) { btn.style.pointerEvents = 'none'; btn.style.opacity = '0.5'; }

      await run(async () => {
        try {
          const data = await api('game/puzzle/start', {});
          puzzleSession = data;
          
          puzzleState = {
            pieces: data.pieces,
            gridSize: data.grid_size,
            deadline: data.deadline,
            server_time: data.server_time,
            items: [],
            cells: []
          };
          
          await sync(); 
          renderPuzzle();
        } catch (e) { 
          if (btn) { btn.style.pointerEvents = 'auto'; btn.style.opacity = '1'; }
          error(e); 
        }
      });
    }

    function renderPuzzle() {
      clearInterval(puzzleTicker);
      const view = $('view');
      const { pieces, gridSize, deadline, server_time } = puzzleState;
      
      // Вычисляем размер кусочка для ленты (чтобы было красиво)
      const pieceSize = Math.floor((Math.min(window.innerWidth - 80, 300)) / gridSize);
      
      view.innerHTML = `
        <h2 style="text-align:center; margin-bottom: 6px;">Собери карту!</h2>
        <div id="puzzle-timer" class="timer" style="text-align:center; font-size: 16px; margin-bottom: 10px;">Осталось: -- сек.</div>
        <div class="puzzle-wrapper">
           <div id="puzzle-area" class="puzzle-area"></div>
           <div id="puzzle-tray" class="puzzle-tray" style="min-height: ${pieceSize + 28}px;"></div>
        </div>
      `;
      
      const area = $('puzzle-area');
      const tray = $('puzzle-tray');
      const pWidth = 100 / gridSize;
      const pHeight = 100 / gridSize;

      const grid = document.createElement('div');
      grid.className = 'puzzle-grid';
      puzzleState.cells = []; 
      
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const cell = document.createElement('div');
          cell.className = 'puzzle-cell';
          cell.style.width = pWidth + '%';
          cell.style.height = pHeight + '%';
          
          puzzleState.cells.push({
            el: cell, col: c, row: r,
            centerX: c * pWidth + pWidth / 2,
            centerY: r * pHeight + pHeight / 2,
            occupiedBy: null
          });
          grid.appendChild(cell);
        }
      }
      area.appendChild(grid);

      const indices = Array.from({ length: pieces.length }, (_, i) => i);
      indices.sort(() => Math.random() - 0.5);

      puzzleState.items = [];

      indices.forEach(i => {
        const el = document.createElement('img');
        el.src = pieces[i];
        el.className = 'puzzle-piece';
        el.dataset.index = i;
        el.style.width = pieceSize + 'px';
        el.style.height = pieceSize + 'px';
        
        el.addEventListener('mousedown', startDrag);
        el.addEventListener('touchstart', startDrag, { passive: false });
        
        tray.appendChild(el);
        puzzleState.items[i] = { el, placed: false, placedCell: null, originalIndex: i, locked: false };
      });
      
      const offset = server_time - Date.now()/1000;
      puzzleTicker = setInterval(() => {
        const left = Math.max(0, Math.ceil(deadline - (Date.now()/1000 + offset)));
        const timerEl = $('puzzle-timer');
        if (timerEl) timerEl.textContent = `Осталось: ${left} сек.`;
        if (left === 0) {
          clearInterval(puzzleTicker); 
          puzzleState = null;
          $('view').innerHTML = `<div style="text-align:center; padding: 40px 20px;"><h2 style="color: #ff6b6b;">Время вышло!</h2><p class="muted">Ты не успел собрать карту.</p><button class="primary wide" onclick="show('games')" style="margin-top: 20px;">Попробовать снова</button></div>`;
        }
      }, 200);
    }

    let dragElement = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let hoveredCell = null;
    let draggedFromCell = null;


    function startDrag(e) {
      if (!puzzleState) return;

      const el = e.currentTarget;
      e.preventDefault();

      const index = Number(el.dataset.index);
      const item = puzzleState.items[index];

      if (!item || item.locked) return;

      // ЗАПОМИНАЕМ ячейку ДО того, как обнулим её
      draggedFromCell = item.placedCell;

      // Освобождаем ячейку
      if (item.placedCell) {
        item.placedCell.occupiedBy = null;
        item.placedCell = null;
        item.placed = false;
      }

      dragElement = el;
      hoveredCell = null;

      const rect = el.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      dragOffsetX = clientX - rect.left;
      dragOffsetY = clientY - rect.top;

      el.style.width = rect.width + 'px';
      el.style.height = rect.height + 'px';
      el.style.left = (clientX - dragOffsetX) + 'px';
      el.style.top = (clientY - dragOffsetY) + 'px';

      document.body.appendChild(el);
      el.classList.remove('placed');
      el.classList.add('dragging');

      document.addEventListener('mousemove', onDrag);
      document.addEventListener('touchmove', onDrag, { passive: false });
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchend', stopDrag);
    }


    function onDrag(e) {
      if (!dragElement) return;

      e.preventDefault();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      dragElement.style.left = (clientX - dragOffsetX) + 'px';
      dragElement.style.top = (clientY - dragOffsetY) + 'px';

      puzzleState.cells.forEach(cell => {
        cell.el.classList.remove('highlight');
      });

      const elRect = dragElement.getBoundingClientRect();
      const pieceCenterX = elRect.left + elRect.width / 2;
      const pieceCenterY = elRect.top + elRect.height / 2;

      hoveredCell = null;
      let minDistance = Infinity;

      for (const cell of puzzleState.cells) {
        const cellRect = cell.el.getBoundingClientRect();

        const cellCenterX = cellRect.left + cellRect.width / 2;
        const cellCenterY = cellRect.top + cellRect.height / 2;

        const dist = Math.hypot(
          pieceCenterX - cellCenterX,
          pieceCenterY - cellCenterY
        );

        if (dist < cellRect.width * 0.8 && dist < minDistance) {
          minDistance = dist;
          hoveredCell = cell;
        }
      }

      if (hoveredCell) {
        hoveredCell.el.classList.add('highlight');
      }
    }


    function stopDrag() {
      if (!dragElement) return;

      const el = dragElement;
      dragElement = null;

      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('touchmove', onDrag);
      document.removeEventListener('mouseup', stopDrag);
      document.removeEventListener('touchend', stopDrag);

      if (!puzzleState) return;

      const index = Number(el.dataset.index);
      const item = puzzleState.items[index];

      if (!item) return;

      const area = $('puzzle-area');
      const tray = $('puzzle-tray');
      if (!area || !tray) return;

      puzzleState.cells.forEach(cell => cell.el.classList.remove('highlight'));

      const gridSize = puzzleState.gridSize;
      const cellSize = 100 / gridSize;
      const pieceSize = Math.floor((Math.min(window.innerWidth - 80, 300)) / gridSize);

      if (hoveredCell) {
        // Если ячейка занята другим кусочком
        if (hoveredCell.occupiedBy && hoveredCell.occupiedBy !== item) {
          const otherItem = hoveredCell.occupiedBy;
          
          if (!otherItem.locked) {
            // Если наш кусочек притащили с поля (память не пуста)
            if (draggedFromCell) {
              // МЕНЯЕМ МЕСТАМИ: старый кусочек летит на нашу старую ячейку
              otherItem.el.className = 'puzzle-piece placed';
              otherItem.el.style.left = (draggedFromCell.col * cellSize) + '%';
              otherItem.el.style.top = (draggedFromCell.row * cellSize) + '%';
              otherItem.el.style.width = cellSize + '%';
              otherItem.el.style.height = cellSize + '%';
              area.appendChild(otherItem.el);
              
              otherItem.placed = true;
              otherItem.placedCell = draggedFromCell;
              draggedFromCell.occupiedBy = otherItem;
              
              // Проверяем, встал ли старый кусочек на правильное место
              const otherCorrectIndex = draggedFromCell.row * gridSize + draggedFromCell.col;
              if (otherItem.originalIndex === otherCorrectIndex) {
                otherItem.locked = true;
                otherItem.el.style.cursor = 'default';
              }
            } else {
              // Если наш кусочек из ленты — старый летит в ленту
              otherItem.placed = false;
              otherItem.placedCell = null;
              otherItem.el.className = 'puzzle-piece';
              otherItem.el.style.left = '';
              otherItem.el.style.top = '';
              otherItem.el.style.width = pieceSize + 'px';
              otherItem.el.style.height = pieceSize + 'px';
              tray.appendChild(otherItem.el);
            }
          } else {
            // Если старый кусочек ЗАЛОЧЕН (на своем правильном месте), мы не можем его сдвинуть
            // Возвращаем наш кусочек обратно (на старое место или в ленту)
            if (draggedFromCell) {
              el.className = 'puzzle-piece placed';
              el.style.left = (draggedFromCell.col * cellSize) + '%';
              el.style.top = (draggedFromCell.row * cellSize) + '%';
              el.style.width = cellSize + '%';
              el.style.height = cellSize + '%';
              area.appendChild(el);
              item.placed = true;
              item.placedCell = draggedFromCell;
              draggedFromCell.occupiedBy = item;
            } else {
              el.className = 'puzzle-piece';
              el.style.left = '';
              el.style.top = '';
              el.style.width = pieceSize + 'px';
              el.style.height = pieceSize + 'px';
              tray.appendChild(el);
            }
            
            hoveredCell = null;
            draggedFromCell = null;
            return;
          }
        }

        // Ставим наш кусочек на поле
        el.className = 'puzzle-piece placed';
        el.style.left = (hoveredCell.col * cellSize) + '%';
        el.style.top = (hoveredCell.row * cellSize) + '%';
        el.style.width = cellSize + '%';
        el.style.height = cellSize + '%';

        area.appendChild(el);

        item.placed = true;
        item.placedCell = hoveredCell;
        hoveredCell.occupiedBy = item;

        const correctIndex = hoveredCell.row * gridSize + hoveredCell.col;

        if (item.originalIndex === correctIndex) {
          item.locked = true;
          el.style.cursor = 'default';
        }

        checkWin();
      } else {
        // Если бросили мимо поля — возвращаем на старое место или в ленту
        if (draggedFromCell) {
          // На старое место
          el.className = 'puzzle-piece placed';
          el.style.left = (draggedFromCell.col * cellSize) + '%';
          el.style.top = (draggedFromCell.row * cellSize) + '%';
          el.style.width = cellSize + '%';
          el.style.height = cellSize + '%';
          area.appendChild(el);
          
          item.placed = true;
          item.placedCell = draggedFromCell;
          draggedFromCell.occupiedBy = item;
        } else {
          // В ленту
          el.classList.remove('dragging');
          el.className = 'puzzle-piece';
          el.style.left = '';
          el.style.top = '';
          el.style.width = pieceSize + 'px';
          el.style.height = pieceSize + 'px';
          tray.appendChild(el);
        }
      }

      hoveredCell = null;
      draggedFromCell = null; // Очищаем память после завершения
    }
    
    function checkWin() {
      if (!puzzleState) return;
      const gridSize = puzzleState.gridSize;
      const allPlacedCorrectly = puzzleState.cells.every(cell => {
        return cell.occupiedBy && cell.occupiedBy.originalIndex === (cell.row * gridSize + cell.col);
      });
      if (allPlacedCorrectly) {
        clearInterval(puzzleTicker);
        finishPuzzle();
      }
    }

    async function finishPuzzle() {
      if (puzzleState && puzzleState.finished) return;
      if (puzzleState) puzzleState.finished = true;
      
      await run(async () => {
        try {
          const res = await api('game/puzzle/finish', { session_id: puzzleSession.session_id });
          if (res.status === 'won') {
            await sync();
            prize(res.card);
          }
        } catch (e) { error(e); }
        puzzleState = null;
      });
    }

    function prize(c) {
      const ownedCard = profile.cards.find(item => Number(item.id) === Number(c.id));
      const count = ownedCard ? ownedCard.count : 1;
      
      const rarityColor = colors[c.rarity] || '#aaa';
      $('reward-card-container').innerHTML = card(c);
      $('reward-subtitle').innerHTML = `<span style="color:#b775ff; font-weight:bold;">+${c.points}</span> рейтинга`;
      $('reward-name').textContent = c.name;
      $('reward-anime').textContent = c.anime;
      $('reward-rarity').textContent = c.rarity;
      $('reward-rarity').style.color = rarityColor;
      $('reward-count').textContent = `${count} шт.`;
      $('reward-modal').classList.add('active');
    }

    async function closeReward(e) { 
      if (e && e.target !== e.currentTarget) return; 
      $('reward-modal').classList.remove('active'); 
      await sync(); 
      if (tab === 'games') {
        games();
      }
    }
    async function sync() { 
      await refresh(); 
      profile.client_time = Date.now() / 1000;
      updateCooldowns(); 
    }
    
    async function run(fn) {
      if (busy) return; busy = true;
      document.querySelectorAll('button').forEach(b => b.disabled = true);
      try { await fn(); } catch (e) { error(e); }
      finally { busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false); toggleFab(false); }
    }
    function toggleFab(forceState) {
      const menu = $('fab-menu'); const overlay = $('fab-overlay'); const mainBtn = $('fab-main'); const profile = $('fab-profile');
      let shouldOpen = typeof forceState === 'boolean' ? forceState : !menu.classList.contains('active');
      if (shouldOpen) { menu.classList.add('active'); overlay.classList.add('active'); mainBtn.classList.add('active'); profile.classList.add('active'); }
      else { menu.classList.remove('active'); overlay.classList.remove('active'); mainBtn.classList.remove('active'); profile.classList.remove('active'); }
    }

    (async () => {
      try { 
        await sync(); 
        show('collection'); 
        setInterval(updateCooldowns, 1000); 
      }
      catch (e) { console.error(e); $('result').hidden = false; $('result').textContent = 'Не удалось войти: ' + e.message; }
    })();
  </script>
</body>
</html>
